<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamkar — Launch, discover, and improve products</title>
  <meta name="description" content="Tamkar is a product-launch and feedback community where founders share what they are building and thoughtful early users help them improve it.">
  <meta name="keywords" content="product launch platform, startup feedback, indie hacker launch, beta feedback, product discovery, founder community">
  <meta name="author" content="Tamkar">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://tamkar.app/">
  <meta http-equiv="refresh" content="3;url=https://tamkar.app/">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #f5f0eb; color: #1c1c1c; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(680px, 100%); text-align: center; }
    .mark { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 1.5rem; border-radius: 17px; background: #a67b0e; color: #fff; font-size: 1.25rem; font-weight: 900; transform: rotate(-7deg); }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(2.6rem, 8vw, 5rem); line-height: .95; letter-spacing: -.045em; }
    .intro { max-width: 560px; margin: 1.25rem auto 2rem; color: #5e574f; font-size: 1.08rem; line-height: 1.65; }
    .cta { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: .8rem 1.4rem; border-radius: 999px; background: #1c1c1c; color: #fff; font-weight: 750; text-decoration: none; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .65rem 1rem; margin-top: 2rem; }
    nav a { color: #785907; font-size: .9rem; font-weight: 650; text-underline-offset: 4px; }
    .notice { margin-top: 1.25rem; color: #81786f; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">t</div>
    <h1>Launch. Listen. Improve.</h1>
    <p class="intro">Tamkar is a community where founders share early-stage products and thoughtful users leave candid feedback they can actually use.</p>
    <a class="cta" href="https://tamkar.app/launch-your-product">Add your product on Tamkar</a>
    <nav aria-label="Explore Tamkar">
      <a href="https://tamkar.app/discover">Discover</a>
      <a href="https://tamkar.app/community">Community</a>
      <a href="https://tamkar.app/field-guide">Field Guide</a>
      <a href="https://tamkar.app/pricing">Pricing</a>
    </nav>
    <p class="notice">Redirecting to tamkar.app in 3 seconds.</p>
  </main>
</body>
</html>
